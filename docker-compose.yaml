services:
  userdata-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${USERDATA_DB_USER}
      POSTGRES_PASSWORD: ${USERDATA_DB_PASSWORD}
      POSTGRES_DB: ${USERDATA_DB_NAME}
    # ports:
    #   - "5433:5432"
    expose:
      - "5432"
    volumes:
      - userdata_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USERDATA_DB_USER} -d ${USERDATA_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  spam-detection-api:
    image: ghcr.io/rifqiansharir/indobert-spam-detection-api:latest
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 5s
      timeout: 1m
      retries: 5
      start_period: 30s

  public-issue-classification-api:
    image: ghcr.io/rifqiansharir/indobert-public-issue-classification-api:latest
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 5s
      timeout: 1m
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPAM_DETECTION_API_URL: http://spam-detection-api:8000/predict
      PUBLIC_ISSUE_CLASSIFICATION_API_URL: http://public-issue-classification-api:8000/predict
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      USERDATA_DB_USER: ${USERDATA_DB_USER}
      USERDATA_DB_PASSWORD: ${USERDATA_DB_PASSWORD}
      USERDATA_DB_NAME: ${USERDATA_DB_NAME}
      USERDATA_DB_HOST: userdata-db
      USERDATA_DB_PORT: 5432
    depends_on:
      userdata-db:
        condition: service_healthy
      spam-detection-api:
        condition: service_healthy
      public-issue-classification-api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  userdata_db_data:
